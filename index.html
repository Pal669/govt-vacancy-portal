<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vacancy Desk</title>
<style>
:root{
  --bg:#f6f5f1;--surface:#ffffff;--surface-2:#efede7;--ink:#1d1d1b;--ink-2:#55534d;--ink-3:#8a877e;
  --line:#e2dfd6;--accent:#1f5f8b;--accent-ink:#ffffff;--focus:#1f5f8b55;
  --ok:#1e7a46;--ok-bg:#e3f3e9;--warn:#9a6200;--warn-bg:#fbefd6;--info:#2453a6;--info-bg:#e4ecfa;
  --check:#5b5b66;--check-bg:#ececf0;--bad:#a83232;--bad-bg:#f8e3e3;--new:#b5470b;
  --net:#6a3fa0;--net-bg:#efe6fa;--econ:#0f6b5c;--econ-bg:#dcf2ec;
  --radius:12px;--shadow:0 1px 2px #0000000d,0 2px 8px #0000000a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--ink:#ecebe6;--ink-2:#b4b1a8;--ink-3:#85827a;
  --line:#33322f;--accent:#6aaad6;--accent-ink:#0d1a24;--focus:#6aaad655;
  --ok:#6cc893;--ok-bg:#16301f;--warn:#e5b25a;--warn-bg:#352812;--info:#8db0ee;--info-bg:#1a2640;
  --check:#b7b7c2;--check-bg:#2a2a30;--bad:#ef8a8a;--bad-bg:#3a1c1c;--new:#f39a5f;--shadow:none;
  --net:#c3a3ef;--net-bg:#2c2140;--econ:#6fd6c2;--econ-bg:#123029;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--ink:#ecebe6;--ink-2:#b4b1a8;--ink-3:#85827a;
  --line:#33322f;--accent:#6aaad6;--accent-ink:#0d1a24;--focus:#6aaad655;
  --ok:#6cc893;--ok-bg:#16301f;--warn:#e5b25a;--warn-bg:#352812;--info:#8db0ee;--info-bg:#1a2640;
  --check:#b7b7c2;--check-bg:#2a2a30;--bad:#ef8a8a;--bad-bg:#3a1c1c;--new:#f39a5f;--shadow:none;
  --net:#c3a3ef;--net-bg:#2c2140;--econ:#6fd6c2;--econ-bg:#123029;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}

/* lock */
#lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lockbox{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow)}
.lockbox h1{margin:0 0 4px;font-size:22px}
.lockbox p{margin:0 0 20px;color:var(--ink-2);font-size:14px}
.lockbox input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.lockbox label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:14px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);padding:7px 12px;font-weight:500}
#err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{padding-bottom:0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.brand{font-weight:700;font-size:18px}
.sub{color:var(--ink-3);font-size:12.5px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:999px;color:var(--ink-2);white-space:nowrap;cursor:pointer;font-weight:500}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tab .n{opacity:.7;font-weight:400;margin-left:4px}

/* summary */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;text-align:left}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{color:var(--ink-2);font-size:13px}
.profile{font-size:12.5px;color:var(--ink-3);margin:-4px 0 12px}

/* filters */
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.ctop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px;font-size:12.5px;color:var(--ink-3)}
.body{font-weight:600;color:var(--ink-2)}
.title{font-size:15px;font-weight:600;line-height:1.35;word-break:break-word}
.title a{color:var(--ink);text-decoration:none}
.title a:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.meta .close{color:var(--bad);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
.t-eligible{background:var(--ok-bg);color:var(--ok)}
.t-borderline{background:var(--warn-bg);color:var(--warn)}
.t-after_bed{background:var(--info-bg);color:var(--info)}
.t-check{background:var(--check-bg);color:var(--check)}
.t-not{background:var(--bad-bg);color:var(--bad)}
.t-other{background:transparent;color:var(--ink-3);border:1px solid var(--line)}
.t-after_net{background:var(--net-bg);color:var(--net)}
.econ{background:var(--econ-bg);color:var(--econ)}
/* university directory */
.utools{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.region{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 6px}
.uni{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px}
.uni>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--ink)}
.uni>summary::-webkit-details-marker{display:none}
.uni>summary .un{font-weight:600;flex:1 1 220px}
.uni>summary .uloc{color:var(--ink-3);font-size:12.5px}
.uni[open]>summary{border-bottom:1px solid var(--line)}
.ubody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.ulinks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.none{background:var(--ink-3)}
.cnt{font-size:12.5px;color:var(--ink-2)}
.muted{color:var(--ink-3);font-size:13px}
.newb{color:var(--new);font-weight:700;font-size:11.5px;letter-spacing:.04em}
.st{background:var(--ink);color:var(--bg)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--ink-3);font-size:12.5px}
.why{margin:6px 0 0;padding:8px 10px;background:var(--surface-2);border-radius:8px;font-size:13px;color:var(--ink-2)}
.why p{margin:0 0 6px}.why p:last-child{margin:0}
.empty{padding:28px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:12px}

/* sources */
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
.okd{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.tablewrap{overflow-x:auto;margin-bottom:20px}
h2{font-size:15px;margin:20px 0 8px}
.more{display:block;margin:14px auto 0}
.sec{margin-top:22px}
.sec:first-of-type{margin-top:4px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.sechead h2{margin:0;font-size:17px}
.sechead b{color:var(--ok)}
@media (max-width:560px){.stat b{font-size:20px}.stat{padding:10px}.hide-sm{display:none}}
</style>
</head>
<body>
<div id="lock" hidden>
  <form class="lockbox" id="lockform" autocomplete="on">
    <h1>Vacancy Desk</h1>
    <p>Private page. Enter your password to open.</p>
    <input type="text" name="username" value="vacancy-desk" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required>
    <label><input type="checkbox" id="remember"> Remember on this device</label>
    <button class="btn full" type="submit" id="unlock">Unlock</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>

const KEY = "vacancy-desk-pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(out));
}
function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

async function unlock(pw, remember) {
  const err = document.getElementById("err");
  err.textContent = "";
  document.getElementById("unlock").textContent = "Opening...";
  try {
    const data = await decrypt(pw);
    if (remember) store(KEY, pw);
    document.getElementById("lock").hidden = true;
    document.getElementById("app").hidden = false;
    App(data);
  } catch (e) {
    store(KEY, null);
    err.textContent = "Wrong password.";
    document.getElementById("unlock").textContent = "Unlock";
  }
}
document.getElementById("lockform").addEventListener("submit", e => {
  e.preventDefault();
  unlock(document.getElementById("pw").value, document.getElementById("remember").checked);
});
if (PAYLOAD.plain) { document.getElementById("app").hidden = false; App(PAYLOAD.plain); }
else { const saved = recall(KEY); if (saved) unlock(saved, true); }

/* ---------------------------------------------------------------- app */
function App(D) {
  const el = document.getElementById("app");
  const today = D.today;
  const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
  const daysTo = iso => Math.round((new Date(iso + "T00:00:00") - new Date(today + "T00:00:00")) / 864e5);
  const fmt = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("en-IN", {day:"2-digit", month:"short", year:"numeric"}) : "";
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const weekAgo = addDays(today, -7);

  // tracker entries for feed items + custom ones
  const items = D.items.map(it => ({...it, track: D.tracker[it.id] || null}));
  for (const c of D.custom) items.push({id:c.id, body:c.body, title:c.title, url:c.url, category:c.category, type:"tracked",
    tag:"check", matches:[], posted:c.updated, first_seen:c.updated, closing:c.closing, track:c, custom:true});
  items.forEach(it => {
    it.close = (it.track && it.track.closing) || it.closing || null;
    it.isNew = !it.baseline && !it.custom && it.first_seen >= weekAgo;
    it.when = it.posted || it.first_seen;
    if (it.category === "state" && !it.state) it.state = D.other_state;
  });
  const closingSoon = it => it.close && daysTo(it.close) >= 0 && daysTo(it.close) <= 7 &&
    !(it.track && ["Applied","Admit card","Exam done","Result","Dropped"].includes(it.track.status));

  const TABS = [
    ["vac", "Vacancies", it => it.type === "advert" || it.type === "notice"],
    ["upd", "Updates", it => it.type === "update"],
    ["news", "News radar", it => it.type === "news"],
    ["track", "My tracker", it => !!it.track],
    ["src", "Sources", null],
  ];
  let S = {tab: recall("vd-tab") || "vac", cat: "all", tag: "all", q: "", only: null, limit: 60,
           ug: "central", withOpen: true, openU: new Set(), openSt: new Set(), sg: "all", sOpenOnly: true,
           states: new Set((() => { try { return JSON.parse(recall("vd-states") || "[]"); } catch (e) { return []; } })())};
  // State govt jobs: chosen states (empty = all). Applies everywhere; remembered on this device.
  const stateOK = it => it.category !== "state" || !S.states.size || S.states.has(it.state);
  const stateNames = () => [...S.states].join(", ");

  function counts() {
    return {
      newc: items.filter(it => it.isNew && it.type !== "update").length,
      soon: items.filter(closingSoon).length,
      tracked: items.filter(it => it.track && it.track.status !== "Dropped").length,
    };
  }

  function card(it) {
    const tag = `<span class="pill t-${it.tag}">${esc(D.tags[it.tag] || "Check")}</span>`;
    const st = it.track ? `<span class="pill st">${esc(it.track.status)}</span>` : "";
    const nw = it.isNew ? `<span class="newb">NEW</span>` : "";
    const close = it.close ? `<span class="${daysTo(it.close) <= 7 && daysTo(it.close) >= 0 ? "close" : ""}">Closes ${fmt(it.close)}${
      daysTo(it.close) >= 0 ? ` (${daysTo(it.close)}d)` : " (closed)"}${(it.track && it.track.closing) || it.closing_official ? "" : " - auto-read, verify"}</span>` : "";

    const rank = it => (closingSoon(it) ? 0 : 10) + (S.tag === "all" ? REL[it.tag] ?? 5 : 0);
    return L.sort((a, b) => rank(a) - rank(b) || (b.when || "").localeCompare(a.when || ""));
  }

  // Vacancies tab: one block per section, in the order of D.categories
  const MINE = new Set(["eligible", "borderline", "after_bed", "after_net", "check"]);
  function sectionsHTML(L) {

  // State govt jobs: state chips (multi-select) + openings grouped state by state
  function stateChips() {
    const base = filtered(true).filter(it => it.category === "state");

  // School teaching: PGT Economics posts only, group by group (KVS, NVS, Sainik, Army, EMRS, Delhi, other states)

    const rows = D.universities.filter(u => u.group === S.ug).map(u => {
      const seenT = new Set();  // colleges often post the same advert twice under different links
      const all = (byU[u.id] || []).filter(it => (S.tag === "all" || it.tag === S.tag)
        && !seenT.has(it.title.toLowerCase()) && seenT.add(it.title.toLowerCase()));
      const open = all.filter(it => current(it) && !it.maybe);
      const perm = open.filter(it => it.permanent), temp = open.filter(it => !it.permanent);
      const maybe = all.filter(it => current(it) && it.maybe);
      return {u, all, perm, temp, maybe, soon: open.filter(closingSoon).length};
    }).filter(r => (!S.withOpen || r.perm.length || r.temp.length || r.maybe.length)
      && (!q.length || q.every(w => (r.u.name + " " + (r.u.state || "") + " " + r.all.map(i => i.title).join(" ")).toLowerCase().includes(w))));
    const others = items.filter(it => it.category === "university" && !it.univ && !it.undated && it.type !== "news");
    const tools = `<div class="utools">${GROUPS.map(([g, label]) =>
      `<button class="chip" data-ug="${g}" aria-pressed="${S.ug === g}">${label} (${D.universities.filter(u => u.group === g).length})</button>`).join("")}
      <button class="chip" data-ug="other" aria-pressed="${S.ug === "other"}">UGC NET & other notices (${others.length})</button></div>
      <div class="utools"><button class="chip" data-uf="withOpen" aria-pressed="${S.withOpen}">Only places with Economics openings</button></div>`;
    if (S.ug === "other") return tools + `<div class="list">${others.length ? others.map(card).join("") : `<div class="empty">Nothing here.</div>`}</div>`;
    const totP = rows.reduce((a, r) => a + r.perm.length, 0), totT = rows.reduce((a, r) => a + r.temp.length, 0);
    const what = {central: "All 55 central universities", du_college: "DU colleges that teach Economics",
                  institute: "Economics research institutes (IEG, CDS, IGIDR, NIPFP, ISI, DSE, MSE, Gokhale)"}[S.ug];
    const head = `<div class="note">${what}: Economics teaching posts only, read twice a day from each one's own recruitment page${S.ug === "central" ? ` and <a href="${esc(D.curec_url)}" target="_blank" rel="noopener">CU-Rec</a> (UGC's common portal)` : ""}. <b>${totP}</b> permanent and <b>${totT}</b> temporary Economics openings now. Every posting shows its pay; tap "Pay & what the job involves" for the full picture. Tap a name to open it.</div>`;
    const sortKey = r => (r.perm.length ? 0 : r.temp.length ? 1 : r.maybe.length ? 2 : 3);
    const block = list => list.sort((a, b) => sortKey(a) - sortKey(b) || a.u.name.localeCompare(b.u.name)).map(r => {
      const u = r.u, older = r.all.filter(it => !current(it));
      const status = u.ok === true ? `<span class="dot ok" title="Site read OK"></span>` : u.ok === false
        ? `<span class="dot bad" title="Couldn't read the site today"></span>` : `<span class="dot none" title="No readable page"></span>`;
      const byDate = (a, b) => (b.when || "").localeCompare(a.when || "");
      const pages = [...new Set(u.pages.length ? u.pages : [u.home])];
      const links = pages.map((p, i) => `<a href="${esc(p)}" target="_blank" rel="noopener">${u.pages.length ? (i ? "Recruitment page " + (i + 1) : "Recruitment page") : "Website"}</a>`).join("")
        + (u.curec ? `<a href="${esc(D.curec_url)}" target="_blank" rel="noopener">CU-Rec</a>` : "");
      const stateNote = u.ok === false ? `<div class="muted">Couldn't read the site today (${esc(u.error || "")}). Open the link to check.</div>`
        : u.ok == null ? `<div class="muted">No readable recruitment page${u.curec ? "; covered through CU-Rec" : ""}. Open the link to check by hand.</div>` : "";
      const sub = (label, L) => L.length ? `<div class="region" style="margin:6px 0 0">${label}</div>${L.sort(byDate).map(card).join("")}` : "";
      const none = !r.perm.length && !r.temp.length && !r.maybe.length;
      const mPerm = r.maybe.filter(it => it.permanent).length;
      return `<details class="uni" data-u="${u.id}" ${S.openU.has(u.id) ? "open" : ""}><summary>${status}<span class="un">${esc(u.name)}</span>
        <span class="uloc">${esc(u.city && u.city !== u.state ? u.city + ", " : "")}${esc(u.state || "")}</span>
        ${r.perm.length ? `<span class="pill econ">${r.perm.length} permanent Economics</span>` : ""}
        ${r.temp.length ? `<span class="pill t-check">${r.temp.length} temporary Economics</span>` : ""}
        ${mPerm ? `<span class="pill t-other">${mPerm} permanent - Economics?</span>` : ""}
        ${r.maybe.length - mPerm ? `<span class="pill t-other">${r.maybe.length - mPerm} temporary - Economics?</span>` : ""}
        ${r.soon ? `<span class="pill t-not">${r.soon} closing soon</span>` : ""}
        ${none ? `<span class="cnt">No Economics openings now</span>` : ""}</summary>
        <div class="ubody"><div class="ulinks">${links}</div>${stateNote}
        ${sub("Permanent Economics posts", r.perm)}${sub("Temporary Economics posts (guest / ad-hoc / contract)", r.temp)}
        ${sub("Permanent posts - subject not stated in the title, may include Economics", r.maybe.filter(it => it.permanent))}
        ${sub("Temporary posts - subject not stated in the title, may include Economics", r.maybe.filter(it => !it.permanent))}
        ${older.length ? `<details><summary>Older and undated Economics notices (${older.length})</summary><div class="list" style="margin-top:8px">${older.map(card).join("")}</div></details>` : ""}
        </div></details>`;
    }).join("");
    if (!rows.length) return tools + head + `<div class="empty">No Economics openings here right now. Untick "Only places with Economics openings" to see every place.</div>`;
    if (S.ug !== "central") return tools + head + block(rows);
    return tools + head + REGIONS.map(g => { const L = rows.filter(r => r.u.region === g);
      return L.length ? `<div class="region">${esc(g)}</div>` + block(L) : ""; }).join("");
  }

  function sourcesView() {
    const H = D.health.slice().sort((a, b) => (a.ok === b.ok ? 0 : a.ok ? 1 : -1));
    return `<div class="note">Every source is read automatically each day. A red row means it couldn't be read today: open it directly. Bodies at the bottom can't be read by a script, so the news radar watches them.</div>
      <h2>Automatic sources</h2><div class="tablewrap"><table><tr><th>Status</th><th>Body</th><th>Items</th><th class="hide-sm">Last OK</th><th>Note</th></tr>${
      H.map(h => `<tr><td class="${h.ok ? "okd" : "bad"}">${h.ok ? "OK" : "Failed"}</td><td><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.body)}</a></td><td>${h.count ?? 0}</td><td class="hide-sm">${fmt(h.last_ok)}</td><td>${esc(h.error || "")}</td></tr>`).join("")
      }</table></div><h2>Check these by hand</h2><div class="tablewrap"><table><tr><th>Body</th><th>Why not automatic</th></tr>${
      D.manual.map(m => `<tr><td><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.body)}</a></td><td>${esc(m.why)}</td></tr>`).join("")
      }</table></div>`;
  }

  function render() {
    const c = counts();
    const okN = D.health.filter(h => h.ok).length;
    const gen = new Date(D.generated);
    const tabN = Object.fromEntries(TABS.filter(t => t[2]).map(t => [t[0], items.filter(t[2]).length]));
    let body;
    if (S.tab === "src") body = sourcesView();
    else {
      const L = filtered();
      const cats = ["all", ...Object.keys(D.categories)];
      const tags = ["all", "eligible", "borderline", "after_bed", "after_net", "check", "not", "other"];
      const grouped = S.tab === "vac" && S.cat === "all" && !S.only;
      const unis = S.tab === "vac" && S.cat === "university" && !S.only;
      const stv = S.tab === "vac" && S.cat === "state" && !S.only;
      const schv = S.tab === "vac" && S.cat === "school" && !S.only;
      const label = S.only === "new" ? "Showing: new this week" : S.only === "soon" ? "Showing: closing in 7 days" : "";
      body = `${S.tab === "track" ? `<div class="note">To add or update an entry, tell Claude, e.g. <i>"applied to PFRDA Grade A"</i> or <i>"track UGC NET Dec 2026, closes 7 Nov"</i>. Statuses: ${D.statuses.join(" / ")}.</div>` : ""}
        ${S.tab === "news" ? `<div class="note">News reports from the last 30 days, matched to the bodies you follow. These are leads, not official notices: open the official site before acting.</div>` : ""}
        <div class="filters"><input class="search" id="q" type="search" placeholder="Search body or post..." value="${esc(S.q)}">
        <div class="chips">${cats.map(k => `<button class="chip" data-cat="${k}" aria-pressed="${S.cat === k}">${k === "all" ? "All areas" : esc(D.categories[k])}</button>`).join("")}</div>
        <div class="chips">${tags.map(k => `<button class="chip" data-tag="${k}" aria-pressed="${S.tag === k}">${k === "all" ? "All tags" : esc(D.tags[k])}</button>`).join("")}</div>
        ${S.cat === "state" ? stateChips() : ""}
        ${label ? `<div class="sub">${label} - <a href="#" id="clearonly">show all</a></div>` : ""}</div>
        ${unis ? uniView() : stv ? stateView(L) : schv ? schoolView(L) : grouped ? sectionsHTML(L) : `<div class="list">${L.length ? L.slice(0, S.limit).map(card).join("") : `<div class="empty">Nothing here with these filters.</div>`}</div>
        ${L.length > S.limit ? `<button class="btn ghost more" id="more">Show more (${L.length - S.limit})</button>` : ""}`}`;
    }
    el.innerHTML = `<header><div class="wrap"><div class="hrow"><div><div class="brand">Vacancy Desk</div>
      <div class="sub">Updated ${gen.toLocaleString("en-IN", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"})} | ${okN}/${D.health.length} sources OK</div></div>
      ${PAYLOAD.plain ? "" : `<button class="btn ghost" id="lockbtn" title="Forget password on this device and lock">Lock</button>`}</div>
      <nav class="tabs" role="tablist">${TABS.map(t => `<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${S.tab === t[0]}">${t[1]}${tabN[t[0]] !== undefined ? `<span class="n">${tabN[t[0]]}</span>` : ""}</button>`).join("")}</nav></div></header>
      <main class="wrap"><div class="stats">
        <button class="stat" data-only="new"><b>${c.newc}</b><span>New this week</span></button>
        <button class="stat" data-only="soon"><b style="color:${c.soon ? "var(--bad)" : "inherit"}">${c.soon}</b><span>Closing in 7 days</span></button>
        <button class="stat" data-goto="track"><b>${c.tracked}</b><span>Tracking</span></button></div>
      <div class="profile">${esc(D.profile)}</div>${body}</main>`;

    el.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.only = null; S.limit = 60; store("vd-tab", S.tab); render(); });
    el.querySelectorAll("[data-st]").forEach(b => b.onclick = () => {
      const s = b.dataset.st;
      if (!s) S.states.clear(); else S.states.has(s) ? S.states.delete(s) : S.states.add(s);
      store("vd-states", S.states.size ? JSON.stringify([...S.states]) : null); S.limit = 60; render(); });
    el.querySelectorAll("[data-sto]").forEach(b => b.onclick = () => {
      const s = b.dataset.sto; S.openSt.has(s) ? S.openSt.delete(s) : S.openSt.add(s); render(); });
    el.querySelectorAll("[data-cat]").forEach(b => b.onclick = e => { e.preventDefault(); S.cat = b.dataset.cat; S.limit = 60; render(); window.scrollTo(0, 0); });
    el.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => { S.tag = b.dataset.tag; S.limit = 60; render(); });
    el.querySelectorAll("[data-only]").forEach(b => b.onclick = () => { S.only = b.dataset.only; S.tab = "vac"; S.cat = "all"; S.tag = "all"; render(); });
    el.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { S.tab = b.dataset.goto; S.only = null; render(); });
    const q = el.querySelector("#q");
    if (q) q.oninput = () => { S.q = q.value; const pos = q.selectionStart; render(); const n = el.querySelector("#q"); n.focus(); n.setSelectionRange(pos, pos); };
    const more = el.querySelector("#more"); if (more) more.onclick = () => { S.limit += 60; render(); };
    const co = el.querySelector("#clearonly"); if (co) co.onclick = e => { e.preventDefault(); S.only = null; render(); };
    el.querySelectorAll("[data-ug]").forEach(b => b.onclick = () => { S.ug = b.dataset.ug; render(); });
    el.querySelectorAll("[data-sg]").forEach(b => b.onclick = () => { S.sg = b.dataset.sg; render(); });
    el.querySelectorAll("[data-sf]").forEach(b => b.onclick = () => { S.sOpenOnly = !S.sOpenOnly; render(); });
    el.querySelectorAll("[data-uf]").forEach(b => b.onclick = () => { S[b.dataset.uf] = !S[b.dataset.uf]; render(); });
    el.querySelectorAll("details.uni").forEach(d => d.addEventListener("toggle", () => {
      d.open ? S.openU.add(d.dataset.u) : S.openU.delete(d.dataset.u); }));
    const lb = el.querySelector("#lockbtn"); if (lb) lb.onclick = () => { store(KEY, null); location.reload(); };
  }
  render();
}
</script>
</body>
</html>
